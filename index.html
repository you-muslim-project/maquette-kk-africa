<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Décoration d'intérieur</title>
<!-- MODÈLE « décorateur d'intérieur 3D » (17/11/2026). On ne touche PAS à ce fichier pour un
     nouveau client : tout ce qui change (nom, ville, avis, WhatsApp, couleurs, photos, textes FR/AR)
     est dans parametres.js. Les séquences 3D sont dans sequences/<scène>/<ordinateur|telephone>/.
     Pour une autre niche : nouvelle scène Blender, mêmes noms de séquences ou CONFIG ci-dessous. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Manrope:wght@400;600&family=Noto+Naskh+Arabic:wght@500&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<script src="parametres.js"></script>
<style>
  :root {
    --fond: #EFE6DA; --texte: #1E1A16; --accent: #B5552B; --second: #2F3A2F;
    --titre: 'Fraunces', Georgia, serif; --corps: 'Manrope', system-ui, sans-serif;
    --apparition: cubic-bezier(.16, 1, .3, 1); --transition: cubic-bezier(.76, 0, .24, 1);
    --marge: clamp(16px, 4vw, 48px);
  }
  [dir="rtl"] { --titre: 'Noto Naskh Arabic', serif; --corps: 'Tajawal', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 400 15px/1.6 var(--corps); overflow-x: hidden; }
  [dir="rtl"] body { font-size: 17px; }
  a { color: inherit; }
  img { max-width: 100%; display: block; }

  .entete { position: fixed; inset: 0 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px var(--marge); z-index: 20; background: color-mix(in srgb, var(--fond) 82%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--texte); }
  .marque { font: 500 18px/1.1 var(--titre); letter-spacing: .02em; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .langue { border: 0; background: none; font: 600 13px/1 var(--corps); color: inherit; cursor: pointer; padding: 10px; text-decoration: underline; text-underline-offset: 4px; }
  .bouton { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 20px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; font: 600 13px/1 var(--corps); letter-spacing: .04em; text-decoration: none; cursor: pointer; transition: background .3s var(--apparition), color .3s var(--apparition), border-color .3s; will-change: transform; }
  .bouton.plein { background: var(--texte); color: var(--fond); border-color: var(--texte); }
  .bouton:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ouverture : le titre monte ligne par ligne */
  .ouverture { position: relative; min-height: 100svh; display: grid; align-content: end; padding: 0 var(--marge) 9vh; overflow: hidden; }
  .ouverture > :not(.apercu) { position: relative; z-index: 1; }
  .apercu { position: absolute; inset-inline-end: 0; top: 9vh; width: min(62vw, 980px); height: 78vh; object-fit: contain; opacity: 0; transform: scale(.96); transition: opacity 1.4s var(--apparition) .2s, transform 1.6s var(--apparition) .2s; pointer-events: none; }
  .vu .apercu { opacity: 1; transform: none; }
  @media (max-aspect-ratio: 4/5) { .apercu { inset-inline: 0; top: 64px; width: 100%; height: 52svh; } .ouverture { padding-bottom: 6vh; } }
  .note-ouverture { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; letter-spacing: .06em; margin-bottom: 3vh; }
  .note-ouverture .etoiles { color: var(--accent); letter-spacing: 2px; }
  .grand-titre { font: 300 clamp(46px, 9vw, 132px)/.92 var(--titre); letter-spacing: -.02em; margin: 0 0 4vh; }
  [dir="rtl"] .grand-titre { letter-spacing: 0; line-height: 1.25; font-weight: 500; font-size: clamp(42px, 9vw, 140px); }
  .ligne { display: block; overflow: hidden; }
  .ligne > span { display: block; transform: translateY(105%); transition: transform 1.1s var(--apparition); }
  .vu .ligne > span { transform: none; }
  .ligne:nth-child(2) > span { transition-delay: .08s; }
  .ligne:nth-child(3) > span { transition-delay: .16s; }
  .chapo { max-width: 38ch; font-size: 16px; opacity: 0; transform: translateY(12px); transition: opacity .9s var(--apparition) .35s, transform .9s var(--apparition) .35s; }
  .vu .chapo { opacity: 1; transform: none; }

  /* scènes 3D épinglées */
  .scene { position: relative; }
  .scene.sombre { background: var(--second); color: var(--fond); }
  .scene .collant { position: sticky; top: 0; height: 100svh; overflow: hidden; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene .texte-scene { position: absolute; inset-inline-start: var(--marge); bottom: 10vh; max-width: 26ch; margin: 0; font: 300 clamp(26px, 3.4vw, 46px)/1.08 var(--titre); }
  [dir="rtl"] .scene .texte-scene { line-height: 1.4; font-weight: 500; }
  .etiquette { position: absolute; transform: translate(-50%, -100%); font: 600 11px/1 var(--corps); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; padding-bottom: 46px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  [dir="rtl"] .etiquette { font-size: 14px; letter-spacing: 0; }
  .etiquette::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 1px; height: 40px; background: currentColor; }
  .etiquette.on { opacity: 1; }
  @media (min-aspect-ratio: 4/5) {
    .scene canvas { inset: auto; top: 6vh; inset-inline-start: 27%; width: 73%; height: calc(100% - 8vh); }
    /* le soir, la caméra s'approche : le sol sort du cadre en bas. Canevas aux proportions de l'image (16:9) et fondu en bas */
    .scene[data-sequence="soiree"] canvas { width: calc(73% - 4vw); height: min(38.81vw, 92vh); top: max(6vh, calc(50% - 19.41vw));
      -webkit-mask-image: linear-gradient(to bottom, #000 76%, transparent 99%); mask-image: linear-gradient(to bottom, #000 76%, transparent 99%); }
    .scene .texte-scene { top: 50%; bottom: auto; transform: translateY(-50%); max-width: min(24ch, 26vw); }
  }
  @media (max-aspect-ratio: 4/5) {
    .scene .texte-scene { left: 0; right: 0; bottom: 0; max-width: none; padding: 70px 16px 7vh; background: linear-gradient(to top, var(--fond) 55%, transparent); }
    .scene.sombre .texte-scene { background: linear-gradient(to top, var(--second) 55%, transparent); }
    .etiquette { display: none; }
  }

  /* bande qui glisse de droite à gauche au défilement */
  .bande { overflow: hidden; padding: 9vh 0; border-block: 1px solid color-mix(in srgb, var(--texte) 18%, transparent); }
  .bande-piste { display: flex; gap: 6vw; white-space: nowrap; font: 300 clamp(36px, 6vw, 92px)/1.1 var(--titre); will-change: transform; }
  .bande-piste span::after { content: '✦'; color: var(--accent); font-size: .4em; vertical-align: middle; margin-inline-start: 6vw; }

  .titre-section { font: 300 clamp(34px, 5vw, 72px)/1 var(--titre); margin: 0 0 6vh; }
  [dir="rtl"] .titre-section { line-height: 1.35; font-weight: 500; }
  .section { padding: 14vh var(--marge); }

  .chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 5vh 4vw; }
  .chiffre b { display: block; font: 300 clamp(58px, 8vw, 120px)/1 var(--titre); }
  .chiffre span { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }

  .avis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 18px; }
  .carte-avis { margin: 0; padding: 28px; border-radius: 22px; background: color-mix(in srgb, var(--texte) 5%, var(--fond)); display: flex; flex-direction: column; gap: 18px; }
  .carte-avis blockquote { margin: 0; font: 300 24px/1.25 var(--titre); }
  .carte-avis figcaption { font-size: 13px; display: flex; justify-content: space-between; gap: 10px; }
  .carte-avis .etoiles { color: var(--accent); letter-spacing: 2px; }
  .source { font-size: 13px; opacity: .7; margin-top: 3vh; }

  .galerie { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .galerie > * { aspect-ratio: 4/5; border-radius: 18px; overflow: hidden; }
  .galerie img { width: 100%; height: 100%; object-fit: cover; }
  .galerie .photo { position: relative; }
  .galerie .mention { position: absolute; inset-inline-start: 10px; bottom: 10px; padding: 4px 9px; border-radius: 99px; font-size: 11px; background: color-mix(in srgb, var(--fond) 85%, transparent); color: var(--texte); }
  .emplacement { border: 1.5px dashed color-mix(in srgb, var(--texte) 35%, transparent); display: grid; place-items: center; text-align: center; padding: 16px; font: 300 20px/1.2 var(--titre); color: color-mix(in srgb, var(--texte) 60%, transparent); }
  @media (max-width: 640px) { .galerie { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .visite { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 6vh 4vw; align-items: end; }
  .visite p { margin: 0 0 10px; font-size: 17px; }

  .contact { padding: 14vh var(--marge) 12vh; background: var(--second); color: var(--fond); }
  .contact h2 { font: 300 clamp(40px, 7vw, 110px)/.95 var(--titre); margin: 0 0 6vh; }
  [dir="rtl"] .contact h2 { line-height: 1.3; font-weight: 500; }
  .formulaire { display: grid; gap: 14px; max-width: 520px; }
  .formulaire input, .formulaire textarea { padding: 14px 16px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--fond) 40%, transparent); background: transparent; color: inherit; font: inherit; }
  .formulaire textarea { min-height: 110px; resize: vertical; }
  .formulaire ::placeholder { color: inherit; opacity: .65; }
  .formulaire label.case { display: flex; gap: 10px; font-size: 13px; opacity: .9; align-items: flex-start; }
  .formulaire .bouton.plein { background: var(--fond); color: var(--second); border-color: var(--fond); }
  .pied { padding: 28px var(--marge); background: var(--second); color: var(--fond); font-size: 12px; opacity: .95; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; border-top: 1px solid color-mix(in srgb, var(--fond) 15%, transparent); }

  .vise { opacity: 0; transform: translateY(24px); transition: opacity .9s var(--apparition), transform .9s var(--apparition); }
  .vise.vu { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .ligne > span, .chapo, .vise { transition: none; transform: none; opacity: 1; } }
</style>
</head>
<body>
<header class="entete">
  <span class="marque" data-champ="nom"></span>
  <div class="actions">
    <button class="langue" type="button" id="langue"></button>
    <a class="bouton aimant" data-lien="whatsapp" data-t="boutonWhatsapp"></a>
  </div>
</header>

<section class="ouverture" id="ouverture">
  <img class="apercu" id="apercu" alt="" onerror="this.hidden=true">
  <div class="note-ouverture"><span class="etoiles">★★★★★</span><span data-champ="noteCourte"></span></div>
  <h1 class="grand-titre" id="grand-titre"></h1>
  <p class="chapo" data-t="chapo"></p>
</section>

<section class="scene" data-sequence="amenagement">
  <div class="collant"><canvas></canvas><p class="texte-scene" data-t="scene1"></p></div>
</section>

<section class="bande" aria-hidden="true"><div class="bande-piste" id="bande"></div></section>

<section class="scene sombre" data-sequence="soiree">
  <div class="collant"><canvas></canvas><p class="texte-scene" data-t="scene2"></p></div>
</section>

<section class="section">
  <div class="chiffres">
    <div class="chiffre vise"><b data-compte="note">0</b><span data-t="chiffreNote"></span></div>
    <div class="chiffre vise"><b data-compte="nombre">0</b><span data-t="chiffreAvis"></span></div>
    <div class="chiffre vise"><b data-compte="cinqEtoiles">0</b><span data-t="chiffreCinq"></span></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <h2 class="titre-section vise" data-t="titreAvis"></h2>
  <div class="avis" id="avis"></div>
  <p class="source" data-t="sourceAvis"></p>
</section>

<section class="section" style="padding-top:0">
  <h2 class="titre-section vise" data-t="titreRealisations"></h2>
  <div class="galerie" id="galerie"></div>
</section>

<section class="section" style="padding-top:0">
  <div class="visite">
    <h2 class="titre-section vise" data-t="titreVisite" style="margin:0"></h2>
    <div class="vise">
      <p data-champ="adresse"></p>
      <p data-champ="horaires"></p>
      <p><a data-lien="telephone" data-champ="telephoneAffiche" dir="ltr"></a></p>
      <a class="bouton aimant" data-lien="carte" target="_blank" rel="noopener" data-t="boutonCarte"></a>
    </div>
  </div>
</section>

<section class="contact" id="contact">
  <h2 data-t="titreContact"></h2>
  <form class="formulaire" id="formulaire">
    <input type="text" name="nom" autocomplete="name" data-ph="champNom" required>
    <textarea name="projet" data-ph="champProjet"></textarea>
    <label class="case"><input type="checkbox" required> <span data-t="consentement"></span></label>
    <button class="bouton plein aimant" type="submit" data-t="boutonEnvoyer"></button>
  </form>
</section>
<footer class="pied"><span id="copyright"></span><span data-t="credits"></span></footer>

<script>
'use strict';
const S = window.SITE;
// ------------------------------------------------------------------ séquences 3D (fixes pour le modèle)
const CONFIG = {
  seuilTelephone: 0.8,
  formats: { ordinateur: [1280, 720], telephone: [720, 1280] },
  sequences: {
    // apparitions : image à partir de laquelle chaque étiquette s'affiche (quand son objet est posé)
    amenagement: { images: 120, ecrans: 3.2, ajustement: 'contain', apparitions: { murs: 28, tapis: 52, canape: 62, arbre: 102 } },
    soiree: { images: 96, ecrans: 2.4, ajustement: 'contain', apparitions: { lanterne: 64 } },
  },
};
let langue = (S.langues || ['fr'])[0];
const tr = (v) => (v && typeof v === 'object' ? (v[langue] ?? v.fr) : v ?? '');
const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
const formatActuel = () => (innerWidth / innerHeight < CONFIG.seuilTelephone ? 'telephone' : 'ordinateur');
const borner = (v) => Math.max(0, Math.min(1, v));

// ------------------------------------------------------------------ remplir la page depuis parametres.js
const r = document.documentElement.style;
for (const [k, v] of Object.entries(S.couleurs || {})) r.setProperty(`--${k}`, v);
const lienWa = (texte) => `https://wa.me/${S.whatsapp}${texte ? `?text=${encodeURIComponent(texte)}` : ''}`;

function remplir() {
  document.documentElement.lang = langue;
  document.documentElement.dir = langue === 'ar' ? 'rtl' : 'ltr';
  document.title = `${tr(S.nom)} · ${tr(S.metier)} · ${tr(S.ville)}`;
  const champs = {
    nom: tr(S.nom), adresse: tr(S.adresse), horaires: tr(S.horaires), telephoneAffiche: S.telephoneAffiche,
    noteCourte: tr(S.textes.noteCourte).replace('{note}', fmt(S.note.valeur, 1)).replace('{nombre}', S.note.nombre),
  };
  document.querySelectorAll('[data-champ]').forEach((el) => { el.textContent = champs[el.dataset.champ] ?? ''; });
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = tr(S.textes[el.dataset.t]).replaceAll('{ville}', tr(S.ville)).replaceAll('{metier}', tr(S.metier)); });
  document.querySelectorAll('[data-ph]').forEach((el) => { el.placeholder = tr(S.textes[el.dataset.ph]); });
  document.querySelectorAll('[data-lien="whatsapp"]').forEach((a) => { a.href = lienWa(tr(S.textes.messageWhatsapp)); a.target = '_blank'; a.rel = 'noopener'; });
  document.querySelectorAll('[data-lien="telephone"]').forEach((a) => { a.href = `tel:+${S.whatsapp}`; });
  document.querySelectorAll('[data-lien="carte"]').forEach((a) => { a.href = S.carte; });
  document.getElementById('langue').textContent = langue === 'fr' ? 'العربية' : 'Français';
  document.getElementById('langue').hidden = (S.langues || []).length < 2;
  document.getElementById('copyright').textContent = `© ${new Date().getFullYear()} ${tr(S.nom)} · ${tr(S.ville)}`;
  const ap = document.getElementById('apercu'); ap.src = `sequences/amenagement/${formatActuel()}/${String(CONFIG.sequences.amenagement.images).padStart(4, '0')}.webp`; ap.hidden = false;
  // titre ligne par ligne
  const h1 = document.getElementById('grand-titre');
  h1.innerHTML = '';
  for (const l of tr(S.textes.titre)) { const a = document.createElement('span'); a.className = 'ligne'; const b = document.createElement('span'); b.textContent = l.replaceAll('{ville}', tr(S.ville)); a.append(b); h1.append(a); }
  // bande
  const bande = document.getElementById('bande'); bande.innerHTML = '';
  const mots = tr(S.textes.bande);
  for (let k = 0; k < 3; k += 1) for (const m of mots) { const s = document.createElement('span'); s.textContent = m; bande.append(s); }
  // avis : seulement ceux de la fiche, tels quels
  const zoneAvis = document.getElementById('avis'); zoneAvis.innerHTML = '';
  for (const a of S.avis) {
    const f = document.createElement('figure'); f.className = 'carte-avis vise vu';
    const q = document.createElement('blockquote'); q.textContent = `« ${a.texte} »`; q.lang = a.langue || 'fr'; q.dir = 'auto';
    const c = document.createElement('figcaption');
    const n = document.createElement('span'); n.textContent = a.nom;
    const e = document.createElement('span'); e.className = 'etoiles'; e.textContent = '★'.repeat(a.etoiles);
    c.append(n, e); f.append(q, c); zoneAvis.append(f);
  }
  // galerie : les photos du client, sinon des emplacements
  const g = document.getElementById('galerie'); g.innerHTML = '';
  // sans photo du client, des photos d'illustration (S.illustrations), toujours marquées comme telles
  const vraies = (S.realisations || []).length > 0;
  const photos = vraies ? S.realisations : (S.illustrations || []);
  const titreGal = document.querySelector('[data-t="titreRealisations"]');
  if (!vraies && photos.length && S.textes.titreIllustrations) titreGal.textContent = tr(S.textes.titreIllustrations);
  const nb = Math.max(photos.length, 6);
  for (let i = 0; i < nb; i += 1) {
    if (photos[i]) {
      const d = document.createElement('div'); d.className = 'photo';
      const im = document.createElement('img'); im.src = photos[i].src; im.alt = tr(photos[i].legende) || ''; im.loading = 'lazy'; d.append(im);
      if (!vraies) { const m = document.createElement('span'); m.className = 'mention'; m.textContent = tr(S.textes.mentionIllustration) || ''; d.append(m); }
      g.append(d);
    }
    else { const d = document.createElement('div'); d.className = 'emplacement'; d.textContent = tr(S.textes.emplacementPhoto); g.append(d); }
  }
  scenes.forEach((s) => s.majEtiquettes());
  document.querySelectorAll('[data-compte]').forEach((el) => { if (el.dataset.fait) el.textContent = valeurCompte(el, 1); });
}
const fmt = (v, dec = 0) => new Intl.NumberFormat('fr-FR', { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(v);

// ------------------------------------------------------------------ le lecteur de séquence
class LecteurSequence {
  constructor(canvas, nom) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.nom = nom;
    this.conf = CONFIG.sequences[nom]; this.total = this.conf.images; this.cible = 0; this.cle = null; this.ancres = null;
    new ResizeObserver(() => { this.redimensionner(); this.dessiner(true); }).observe(canvas);
    this.redimensionner(); this.charger(formatActuel());
  }
  url(i) { return `sequences/${this.nom}/${this.format}/${String(i + 1).padStart(4, '0')}.webp`; }
  charger(format) {
    this.format = format; this.dims = CONFIG.formats[format];
    const jeton = this.jeton = (this.jeton || 0) + 1;
    this.images = new Array(this.total); this.pretes = new Uint8Array(this.total);
    const ordre = [];
    for (let i = 0; i < this.total; i += 8) ordre.push(i);
    for (let i = 0; i < this.total; i += 1) if (i % 8) ordre.push(i);
    let pos = 0;
    const suivant = () => {
      if (jeton !== this.jeton || pos >= ordre.length) return;
      const i = ordre[pos++]; const img = new Image(); img.decoding = 'async';
      img.onload = () => { if (jeton === this.jeton) { this.images[i] = img; this.pretes[i] = 1; this.dessiner(); } suivant(); };
      img.onerror = suivant; img.src = this.url(i);
    };
    for (let k = 0; k < 6; k += 1) suivant();
    fetch(`sequences/${this.nom}/${format}/ancres.json`).then((x) => (x.ok ? x.json() : null)).then((a) => { if (jeton === this.jeton) this.ancres = a; }).catch(() => {});
  }
  verifierFormat() { if (formatActuel() !== this.format) this.charger(formatActuel()); }
  progression(p) { this.cible = Math.round(borner(p) * (this.total - 1)); this.dessiner(); }
  plusProche(i) {
    for (let d = 0; d < this.total; d += 1) {
      if (i - d >= 0 && this.pretes[i - d]) return i - d;
      if (i + d < this.total && this.pretes[i + d]) return i + d;
    }
    return -1;
  }
  redimensionner() {
    const b = this.canvas.getBoundingClientRect(); const dpr = Math.min(devicePixelRatio || 1, 2);
    this.l = b.width; this.h = b.height;
    this.canvas.width = Math.max(1, Math.round(b.width * dpr)); this.canvas.height = Math.max(1, Math.round(b.height * dpr));
    this.cle = null;
  }
  echelle() { const [iw, ih] = this.dims; return (this.conf.ajustement === 'contain' ? Math.min : Math.max)(this.l / iw, this.h / ih); }
  dessiner(force) {
    const idx = this.plusProche(this.cible);
    if (idx < 0 || (!force && idx === this.cle)) return;
    this.cle = idx;
    const { ctx } = this; const W = this.canvas.width; const H = this.canvas.height; const img = this.images[idx];
    const s = (this.conf.ajustement === 'contain' ? Math.min : Math.max)(W / img.naturalWidth, H / img.naturalHeight);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(img, (W - img.naturalWidth * s) / 2, (H - img.naturalHeight * s) / 2, img.naturalWidth * s, img.naturalHeight * s);
    if (this.surImage) this.surImage(idx);
  }
  versEcran(x, y) { const [iw, ih] = this.dims; const s = this.echelle(); const c = this.canvas; return [c.offsetLeft + (this.l - iw * s) / 2 + x * iw * s, c.offsetTop + (this.h - ih * s) / 2 + y * ih * s]; }
}

const scenes = [...document.querySelectorAll('.scene[data-sequence]')].map((sec) => {
  const nom = sec.dataset.sequence; const conf = CONFIG.sequences[nom];
  sec.style.height = `${(conf.ecrans + 1) * 100}svh`;
  const lecteur = new LecteurSequence(sec.querySelector('canvas'), nom);
  let etiquettes = [];
  const majEtiquettes = () => {
    etiquettes.forEach((e) => e.el.remove());
    etiquettes = Object.entries((S.etiquettes || {})[nom] || {}).map(([repere, texte]) => {
      const el = document.createElement('span'); el.className = 'etiquette'; el.textContent = tr(texte);
      sec.querySelector('.collant').append(el); return { repere, el };
    });
    lecteur.dessiner(true);
  };
  lecteur.surImage = (idx) => {
    const a = lecteur.ancres && lecteur.ancres[String(idx + 1)];
    for (const e of etiquettes) {
      const p = a && a[e.repere];
      const des = (conf.apparitions || {})[e.repere] || 0;
      if (!p || !p[2] || idx + 1 < des) { e.el.classList.remove('on'); continue; }
      const [x, y] = lecteur.versEcran(p[0], p[1]);
      e.el.style.left = `${x}px`; e.el.style.top = `${y}px`; e.el.classList.add('on');
    }
  };
  return { sec, lecteur, majEtiquettes };
});

const bande = document.getElementById('bande');
function majDefilement() {
  for (const { sec, lecteur } of scenes) {
    const b = sec.getBoundingClientRect();
    if (b.bottom < -innerHeight || b.top > innerHeight * 2) continue;
    lecteur.progression(reduit ? 1 : -b.top / Math.max(1, b.height - innerHeight));
  }
  if (!reduit) {
    const b = bande.parentElement.getBoundingClientRect();
    const p = borner((innerHeight - b.top) / (innerHeight + b.height));
    const sens = document.documentElement.dir === 'rtl' ? 1 : -1;
    bande.style.transform = `translateX(${sens * p * 40}%)`;
  }
}
let enAttente = false;
addEventListener('scroll', () => { if (!enAttente) { enAttente = true; requestAnimationFrame(() => { enAttente = false; majDefilement(); }); } }, { passive: true });
addEventListener('resize', () => { scenes.forEach(({ lecteur }) => lecteur.verifierFormat()); majDefilement(); });

// ------------------------------------------------------------------ apparitions et compteurs (depuis 0)
const decimales = (cle) => (cle === 'note' ? 1 : 0);
const valeurCompte = (el, k) => fmt((cleValeur(el.dataset.compte) || 0) * k, decimales(el.dataset.compte));
const cleValeur = (c) => (c === 'note' ? S.note.valeur : S.note[c]);
const voir = new IntersectionObserver((entrees) => {
  for (const e of entrees) {
    if (!e.isIntersecting) continue;
    e.target.classList.add('vu');
    e.target.querySelectorAll('[data-compte]').forEach(compter);
    voir.unobserve(e.target);
  }
}, { threshold: 0.3 });
function compter(el) {
  el.dataset.fait = '1';
  const fin = cleValeur(el.dataset.compte); const dec = decimales(el.dataset.compte);
  if (reduit) { el.textContent = fmt(fin, dec); return; }
  const t0 = performance.now(); const duree = 1400;
  const pas = (t) => { const k = borner((t - t0) / duree); const e = 1 - Math.pow(1 - k, 4); el.textContent = fmt(fin * e, dec); if (k < 1) requestAnimationFrame(pas); };
  requestAnimationFrame(pas);
}

// ------------------------------------------------------------------ formulaire : ouvre WhatsApp, n'envoie rien tout seul
document.getElementById('formulaire').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const texte = `${tr(S.textes.messageWhatsapp)}\n${f.nom.value}${f.projet.value ? `\n${f.projet.value}` : ''}`;
  open(lienWa(texte), '_blank', 'noopener');
});

document.getElementById('langue').addEventListener('click', () => {
  const l = S.langues || ['fr']; langue = l[(l.indexOf(langue) + 1) % l.length]; remplir(); majDefilement();
  document.getElementById('ouverture').classList.add('vu');
});

remplir();
majDefilement();
document.querySelectorAll('.ouverture, .vise').forEach((el) => voir.observe(el));

if (matchMedia('(hover: hover) and (pointer: fine)').matches && !reduit) {
  document.querySelectorAll('.aimant').forEach((b) => {
    b.addEventListener('pointermove', (e) => { const x = b.getBoundingClientRect(); b.style.transform = `translate(${(e.clientX - x.left - x.width / 2) * 0.25}px, ${(e.clientY - x.top - x.height / 2) * 0.35}px)`; });
    b.addEventListener('pointerleave', () => { b.style.transform = ''; });
  });
}
</script>
